services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: monitoring_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      PROMETHEUS_TARGETS: ${PROMETHEUS_TARGETS:?Set PROMETHEUS_TARGETS in .env}
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
    entrypoint: ["/bin/sh", "/etc/prometheus/render-targets.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/render-targets.sh:/etc/prometheus/render-targets.sh:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.0
    container_name: monitoring_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SMTP_ENABLED: ${SMTP_ENABLED:?Set SMTP_ENABLED in .env}
      GF_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      GF_SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in .env}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data: