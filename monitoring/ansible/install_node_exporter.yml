---
- name: Desplegar Node Exporter como servicio Systemd
  hosts: all
  become: yes
  vars:
    node_exporter_version: "1.6.1"
    node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    node_exporter_port: "9100"
    node_exporter_user: "node_exporter"

  tasks:
    - name: Crear usuario de sistema para Node Exporter
      user:
        name: "{{ node_exporter_user }}"
        shell: /bin/false
        system: yes
        create_home: no

    - name: Descargar binario oficial de Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"

    - name: Extraer binario
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: Mover binario a /usr/local/bin
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: '0755'
        remote_src: yes

    - name: Crear archivo de servicio Systemd
      copy:
        dest: "/etc/systemd/system/node_exporter.service"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=":{{ node_exporter_port }}"
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Recargar daemon systemd, habilitar e iniciar servicio
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Limpiar archivos temporales
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"